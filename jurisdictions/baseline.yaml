# Comparison data. The format is defined by fpsot-spec-doc (model/jurisdiction.yaml).
topics:
  signed-commits: {en: Signed commits, fr: Commits signés}
  commit-messages: {en: Commit messages, fr: Messages de commit}
  releases: {en: Release versions, fr: Numéros de version}
  branch-protection: {en: Branch protection, fr: Protection des branches}
rows:
  - id: VCS-001
    topic: signed-commits
    requirement: {en: The author signs every commit., fr: L’auteur signe chaque commit.}
    international: {en: "The SLSA source track does not require signed commits. It names signatures only as one way to manage identity.", fr: "Le volet source de SLSA n’exige pas de commits signés. Il cite la signature seulement comme une façon de gérer l’identité."}
    international_source: {title: "SLSA, Source Track: Requirements", version: "1.2", date: "2025-11-24", url: "https://slsa.dev/spec/v1.2/source-requirements", archive: "https://web.archive.org/web/20261016202156/https://slsa.dev/spec/v1.2/source-requirements"}
    fpsot: {en: "Every commit is signed with a key. The repository rejects unsigned commits.", fr: "Chaque commit est signé avec une clé. Le dépôt refuse les commits non signés."}
  - id: VCS-003
    topic: commit-messages
    requirement: {en: Commit messages follow Conventional Commits., fr: Les messages de commit suivent Conventional Commits.}
    international: {en: "Each message starts with a type such as feat or fix, an optional scope, then a colon and a space.", fr: "Chaque message commence par un type comme feat ou fix, une portée facultative, puis un deux-points et une espace."}
    international_source: {title: "Conventional Commits", version: "1.0.0", url: "https://www.conventionalcommits.org/en/v1.0.0/", archive: "https://web.archive.org/web/20261101153816/https://www.conventionalcommits.org/en/v1.0.0/"}
    fpsot: {en: "Conventional Commits 1.0.0 for every commit message and pull request title.", fr: "Conventional Commits 1.0.0 pour chaque message de commit et chaque titre de demande de tirage."}
  - id: VCS-106
    topic: releases
    requirement: {en: A release is a signed vX.Y.Z tag., fr: Une version est une étiquette signée vX.Y.Z.}
    international: {en: "A version has the form X.Y.Z. A tag such as v1.2.3 names version 1.2.3.", fr: "Une version a la forme X.Y.Z. Une étiquette comme v1.2.3 désigne la version 1.2.3."}
    international_source: {title: "Semantic Versioning", version: "2.0.0", url: "https://semver.org/spec/v2.0.0.html", archive: "https://web.archive.org/web/20261026045444/https://semver.org/spec/v2.0.0.html"}
    fpsot: {en: "A signed, annotated vX.Y.Z tag that follows Semantic Versioning 2.0.0.", fr: "Une étiquette annotée et signée vX.Y.Z qui suit Semantic Versioning 2.0.0."}
  - id: VCS-110
    topic: branch-protection
    requirement: {en: Protected branches block force-pushes and deletion., fr: Les branches protégées bloquent les poussées forcées et la suppression.}
    international: {en: "The primary branch rejects direct commits. Deleting it needs an explicit confirmation.", fr: "La branche principale refuse les commits directs. Sa suppression demande une confirmation explicite."}
    international_source: {title: "OpenSSF Open Source Project Security Baseline, OSPS-AC-03", version: "v2026.08.28", date: "2026-08-28", url: "https://baseline.openssf.org/versions/2026-08-28", archive: "https://github.com/ossf/security-baseline/blob/a26a7963f6fd098c1e82829322ec9e1196a4f294/baseline/OSPS-AC.yaml#L67"}
    fpsot: {en: "main and release branches block force-pushes and deletion, and need a pull request.", fr: "Les branches main et de version bloquent les poussées forcées et la suppression, et exigent une demande de tirage."}
