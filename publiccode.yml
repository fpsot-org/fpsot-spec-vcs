publiccodeYmlVersion: "0.4"
name: FPSOT version control specification
url: "https://github.com/fpsot-org/fpsot-spec-vcs"
platforms:
  - web
categories:
  - it-development
developmentStatus: concept
softwareType: "standalone/other"
description:
  en:
    shortDescription: Version control rules for FPSOT projects.
    longDescription: >
      Rules for signed commits, commit messages, branches, merging and
      releases in FPSOT projects, with a GitHub ruleset that enforces them.
    features:
      - Signed commits and releases
      - Trunk-based development with squash merges
  fr:
    shortDescription: Règles de gestion des versions des projets FPSOT.
    longDescription: >
      Règles sur les commits signés, les messages de commit, les branches,
      la fusion et les versions des projets FPSOT, avec un ensemble de
      règles GitHub qui les applique.
    features:
      - Commits et versions signés
      - Tronc commun et fusion par écrasement
